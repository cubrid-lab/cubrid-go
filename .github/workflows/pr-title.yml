name: Check PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash merges use the PR title as the commit subject on main, and
      # Release Please builds the version bump and CHANGELOG from it.
      # An optional lowercase scope is allowed (e.g. chore(deps) from
      # Dependabot, chore(main) from Release Please, docs(readme)).
      - name: Require the Conventional Commits title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'type: description' or 'type(scope): description' (Conventional Commits). Got: $TITLE"
            exit 1
          fi
