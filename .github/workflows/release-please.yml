name: Prepare reviewed Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PR-only: merging the Release PR does not create a tag or a GitHub
      # Release. Go modules are published by the tag, so a maintainer creates
      # vX.Y.Z after the release preflight (docs/RELEASE_PROCESS.md).
      - name: Propose version and changelog in a Release PR
        uses: googleapis/release-please-action@v5
        with:
          # Supply a restricted PAT for automatic PR CI (or mint an App token per run).
          # With GITHUB_TOKEN, manually rerun CI on generated Release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
